    notes: "Precise Placement. Validar com baixa velocidade."

  RT1:
    type: RT
    frame_id: map
    pose: {x: 0.0, y: 0.0, yaw: 0.0}
    final_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    approach_pose: {x: -0.80, y: 0.0, yaw: 0.0}
