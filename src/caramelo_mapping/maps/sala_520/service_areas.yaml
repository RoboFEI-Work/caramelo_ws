# Service Areas da sala_520.
#
# Este e o arquivo humano principal. Edite ou salve poses aqui; o arquivo
# docking.yaml e tecnico e deve ser sincronizado a partir deste arquivo.
#
# Regra operacional da arena:
# - o robo comeca o mapeamento parado em START;
# - nesse instante map, odom e base_footprint devem estar coerentes;
# - START fica em x=0.0, y=0.0, yaw=0.0 para simplificar AMCL e Nav2.
#
# Campos:
# - pose/final_pose: pose onde o robo termina a aproximacao da area.
# - approach_pose: pose de pre-aproximacao usada para visualizar/validar.
# - approach.offset: distancia atras da pose final, no eixo -X do robo.
# - free_area: area frontal que precisa estar livre. AJUSTAR_NO_ROBO.
map_name: sala_520
frame_id: map
version: 1
defaults:
  robot_footprint:
    length: 0.71
    width: 0.47
  approach_offset: 0.70
  free_area:
    width: 0.85
    depth: 0.70

service_areas:
  START:
    type: START
    frame_id: map
    pose: {x: 0.0, y: 0.0, yaw: 0.0}
    final_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    approach_pose: {x: -0.70, y: 0.0, yaw: 0.0}
    approach:
      offset: 0.70
      docking_offset: 0.0
      linear_tolerance: 0.05
      angular_tolerance: 0.05
    station: {width: 0.0, depth: 0.0, height: 0.0}
    free_area: {width: 0.85, depth: 0.70}
    dock:
      enabled: true
      id: START
      type: caramelo_front_dock
    notes: "Inicio logico da arena. O robo deve iniciar o SLAM aqui."

  FINISH:
    type: FINISH
    frame_id: map
    pose: {x: 0.0, y: 0.0, yaw: 0.0}
    final_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    approach_pose: {x: -0.70, y: 0.0, yaw: 0.0}
    approach:
      offset: 0.70
      docking_offset: 0.0
      linear_tolerance: 0.05
      angular_tolerance: 0.05
    station: {width: 0.0, depth: 0.0, height: 0.0}
    free_area: {width: 0.85, depth: 0.70}
    dock:
      enabled: true
      id: FINISH
      type: caramelo_front_dock
    notes: "Pose final da prova. Salvar no robo real antes da rodada."

  WS1:
    type: WS
    frame_id: map
    pose: {x: 0.0, y: 0.0, yaw: 0.0}
    final_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    approach_pose: {x: -0.70, y: 0.0, yaw: 0.0}
    approach:
      offset: 0.70
      docking_offset: 0.0
      linear_tolerance: 0.05
      angular_tolerance: 0.05
    station: {width: 0.80, depth: 0.50, height: 0.10}
    free_area: {width: 0.85, depth: 0.70}
    dock:
      enabled: true
      id: WS1
      type: caramelo_front_dock
    notes: "Workstation. AJUSTAR_NO_ROBO."

  WS2:
    type: WS
    frame_id: map
    pose: {x: 0.0, y: 0.0, yaw: 0.0}
    final_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    approach_pose: {x: -0.70, y: 0.0, yaw: 0.0}
    approach:
      offset: 0.70
      docking_offset: 0.0
      linear_tolerance: 0.05
      angular_tolerance: 0.05
    station: {width: 0.80, depth: 0.50, height: 0.10}
    free_area: {width: 0.85, depth: 0.70}
    dock:
      enabled: true
      id: WS2
      type: caramelo_front_dock
    notes: "Workstation. AJUSTAR_NO_ROBO."

  WS3:
    type: WS
    frame_id: map
    pose: {x: 0.0, y: 0.0, yaw: 0.0}
    final_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    approach_pose: {x: -0.70, y: 0.0, yaw: 0.0}
    approach:
