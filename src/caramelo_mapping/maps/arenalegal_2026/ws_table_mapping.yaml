# Mapeamento centralizado da arena (1 arquivo POR MAPA):
#  - ws_to_table_pose: WS da tarefa -> group_state do braco (lido pelo task_planner)
#  - ws_to_dock_id:    WS da tarefa -> dock_id do docking.yaml (lido pelo executor de missao)
# GERADO a partir do service_areas.yaml (altura da mesa -> Mesa0/5/10/15;
# shelf -> MesaSh). Pode editar a vontade: o sync so ADICIONA chaves que
# faltam, nunca sobrescreve valores existentes.
ws_to_table_pose:
  WS_1: Mesa15
  WS_2: Mesa15
  WS_3: Mesa15
  WS_4: Mesa15
  WS_5: Mesa15
  WS_6: Mesa15
  SH_1: MesaSh
  PP_1: Mesa10
  # 2026-10-21: ST = area de empilhamento do formato 2026 (task nomeia "ST",
  # sem sufixo; planner e executor resolvem por prefixo -> ST_1). Altura a
  # conferir na arena.
  ST_1: Mesa15
ws_to_dock_id:
  WS_1: WS1
  WS_2: WS2
  WS_3: WS3
  WS_4: WS4
  WS_5: WS5
  WS_6: WS6
  SH_1: SH1
  PP_1: PP1
  # gravar a pose do dock ST1 em service_areas.yaml (e docking.yaml) antes de
  # usar: sem ela o executor aborta com "estacao nao existe no docking.yaml".
  ST_1: ST1
# 2026-10-19 (superficie livre): lados da mesa encostados numa PAREDE, vistos
# pelo ROBO docado de frente para a mesa (rulebook 4.4: a zona de manipulacao
# comeca a 10 cm da parede). O executor manda isto no goal do place
# (wall_sides); sem a estacao aqui = sem parede. Valores: [left], [right],
# [left, right]. Exemplo (DESCOMENTAR e ajustar quando a arena tiver parede):
# ws_walls:
#   WS_3: [left]
#   WS_6: [right]
