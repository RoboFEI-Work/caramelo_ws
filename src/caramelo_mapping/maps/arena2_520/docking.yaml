dock_plugins:
  caramelo_front_dock:
    plugin: opennav_docking::SimpleNonChargingDock
    docking_threshold: 0.05
    # -0.7 -> -0.45 (operador, 2026-07-21): com 0.7 a staging caia perto de
    # parede em bancadas encostadas (WS2) e o UNDOCK (que recua ate a staging)
    # estourava timeout sem espaco fisico. 0.45 basta para alinhar o approach.
    staging_x_offset: -0.45
    staging_yaw_offset: 0.0
    dock_direction: forward
    rotate_to_dock: false
    use_external_detection_pose: false
    use_battery_status: false
    use_stall_detection: false
  caramelo_precision_front_dock:
    plugin: opennav_docking::SimpleNonChargingDock
    docking_threshold: 0.03
    staging_x_offset: -0.8
    staging_yaw_offset: 0.0
    dock_direction: forward
    rotate_to_dock: false
    use_external_detection_pose: false
    use_battery_status: false
    use_stall_detection: false
  caramelo_shelf_front_dock:
    plugin: opennav_docking::SimpleNonChargingDock
    docking_threshold: 0.06
    staging_x_offset: -0.9
    staging_yaw_offset: 0.0
    dock_direction: forward
    rotate_to_dock: false
    use_external_detection_pose: false
    use_battery_status: false
    use_stall_detection: false
docks:
  START:
    type: caramelo_front_dock
    frame: map
    pose:
    - 0.0
    - 0.0
    - 0.0
    id: START
  FINISH:
    type: caramelo_front_dock
    frame: map
    pose:
    - 0.8032
    - -6.818
    - 1.807581
    id: FINISH
  WS1:
    type: caramelo_front_dock
    frame: map
    pose:
    - 0.2859
    - -3.0834
    - 3.018439
    id: WS1
  WS2:
    type: caramelo_front_dock
    frame: map
    pose:
    - 1.306
    - -1.1277
    - 2.978096
    id: WS2
  WS3:
    type: caramelo_front_dock
    frame: map
    pose:
    - 0.0
    - 0.0
    - 0.0
    id: WS3
  WS4:
    type: caramelo_front_dock
    frame: map
    pose:
    - 0.0
    - 0.0
    - 0.0
    id: WS4
  SH1:
    type: caramelo_shelf_front_dock
    frame: map
    pose:
    - 0.0
    - 0.0
    - 0.0
    id: SH1
  PP1:
    type: caramelo_precision_front_dock
    frame: map
    pose:
    - 0.0
    - 0.0
    - 0.0
    id: PP1
  RT1:
    type: caramelo_precision_front_dock
    frame: map
    pose:
    - 0.0
    - 0.0
    - 0.0
    id: RT1
