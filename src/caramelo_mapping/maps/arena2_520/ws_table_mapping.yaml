#  - ws_to_dock_id:    WS da tarefa -> dock_id do docking.yaml (lido pelo executor de missao)
ws_to_table_pose:
  WS_1: Mesa15
  WS_2: Mesa10
  WS_3: Mesa10
  WS_4: Mesa15
  WS_5: Mesa0
  WS_6: Mesa5
  WS_7: Mesa10
  WS_8: Mesa15
  # 2026-08-12: SH = prateleira. MesaSh dispara a sequencia propria
  # (pick em 2 fases com IK custom; place passando pelo `pirocao`).
  SH_1: MesaSh
  SH_2: MesaSh
ws_to_dock_id:
  WS_1: WS1
  WS_2: WS2
  WS_3: WS3
  WS_4: WS4
  SH_1: SH1
