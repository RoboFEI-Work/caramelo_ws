amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    tf_broadcast: True
    # 0.6 -> 1.0 (2026-08-07): num pico de carga do notebook o map->odom ficou
    # ~300ms velho e o RotationShim abortou ("Failed to transform pose") ->
    # cascata de recoveries com re cega ate bater nas caixas. 1.0s de folga na
    # validade da TF publicada absorve o soluco; o custo e tolerar pose um
    # pouco mais defasada em movimento (aceitavel a <=0.5 m/s).
    transform_tolerance: 1.0
    save_pose_rate: 0.5

    # Convencao sala_520: o robo inicia a navegacao no START, que e 0,0,0.
    # Durante o mapeamento, nao empurrar o robo antes do SLAM iniciar.
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # 2026-11-11 (bags 21h08 e 21h15, caixa "obstaculo dinamico" junto da WS5):
    # nas duas corridas, enquanto o robo girava parado na staging da WS5 com a
    # caixa a vista, o AMCL "derrapou" 0,5-0,8 m para dentro da mesa (map->odom
    # mudou 2,4 m / 31 graus em 12 s sem o robo sair do lugar, sigma 0,13 =
    # convicto e errado). Dai': "Start occupied" em todo planner, escape
    # "nenhuma direcao segura", 8 estacoes puladas em 90 s, docking apontando
    # para o lado errado. Causa: modelo de sensor afiado (z_hit 0,8 / z_rand
    # 0,1) encaixando as paredes da caixa nas bordas das mesas do mapa.
    # Mudancas: (1) likelihood_field_prob + do_beamskip (unico modelo em que
    # o beam skipping funciona: feixes que a maioria das particulas nao
    # explica pelo mapa sao ignorados = obstaculos nao mapeados); (2) z_hit/
    # z_rand 0,5/0,5 (default do Nav2: pesa menos cada feixe que "casa", nao
    # colapsa em cima de um encaixe falso); (3) recovery_alpha 0/0 (default do
    # Nav2: sem injecao de particulas aleatorias quando a verossimilhanca cai
    # — e' exatamente o que uma caixa nova provoca). Reverter = likelihood_field,
    # do_beamskip false, z_hit 0.80, z_rand 0.10, recovery 0.001/0.1.
    # 2026-11-11 22h (bag 22h03, com o prob+beamskip ligados): a nuvem ficou 3x
    # mais apertada (sigma 0,04 vs 0,12) e o AMCL atravessou a parede central
    # em 5 s, perdendo 89 graus (giroscopio e EKF concordam entre si). Modelo
    # volta a likelihood_field (sem beamskip, que so' existe no prob); z 0,5/0,5
    # e recovery 0 ficam. Quem segura o AMCL agora e' o localization_watchdog
    # (launch de localizacao), que o reinicia na pose da odometria quando foge.

    laser_model_type: "likelihood_field"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    # 2026-07-23 (A/B rodada 1, medido): 2.0 -> 0.5. Com 2.0 + sigma 0.2 a
    # bacia de likelihood era mole demais: mesa mal-desenhada "atraia" a pose
    # (arrasto de 30-40cm no arena2_520) e um offset de 6-8cm nao era puxado
    # de volta (medido: mediano 6cm/p90 12.8cm a 2m da mesa SEM recuperar).
    # Com 0.5, obstaculo fora do lugar vira ruido em vez de ima.
    laser_likelihood_max_dist: 0.5
    laser_max_range: 15.0
    laser_min_range: 0.07
    max_beams: 80
    pf_err: 0.05
    pf_z: 0.99
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05


    resample_interval: 1
    max_particles: 1000
    min_particles: 600
    recovery_alpha_fast: 0.0
    # 2026-07-23: 0.1 -> 0.001. Com slow == fast a razao w_fast/w_slow fica ~1
    # e a injecao de recuperacao (1 - w_fast/w_slow) NUNCA dispara — o filtro
    # ficava preso em bacia errada sem mecanismo de escape (teoria: slow<<fast,
    # valores canonicos 0.001/0.1).
    recovery_alpha_slow: 0.0
    # 0.2 -> 0.05 (2026-08-03): com 0.2 o AMCL CONGELAVA map->odom durante os
    # movimentos finos do docking (passos < 20cm/11deg nao disparavam update) e
    # o refino via LiDAR brigava com uma pose global defasada. 0.05 atualiza a
    # cada 5cm/3deg; 500 particulas seguram o custo na CPU do notebook.
    update_min_a: 0.05
    update_min_d: 0.05
