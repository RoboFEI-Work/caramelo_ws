amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    tf_broadcast: True
    transform_tolerance: 0.6
    save_pose_rate: 0.5

    # Convencao sala_520: o robo inicia a navegacao no START, que e 0,0,0.
    # Durante o mapeamento, nao empurrar o robo antes do SLAM iniciar.
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    # 2026-07-23 (A/B rodada 1, medido): 2.0 -> 0.5. Com 2.0 + sigma 0.2 a
    # bacia de likelihood era mole demais: mesa mal-desenhada "atraia" a pose
    # (arrasto de 30-40cm no arena2_520) e um offset de 6-8cm nao era puxado
    # de volta (medido: mediano 6cm/p90 12.8cm a 2m da mesa SEM recuperar).
    # Com 0.5, obstaculo fora do lugar vira ruido em vez de ima.
    laser_likelihood_max_dist: 0.5
    laser_max_range: 15.0
    laser_min_range: 0.07
    max_beams: 80
    pf_err: 0.05
    pf_z: 0.99
    sigma_hit: 0.2
    z_hit: 0.80
    z_max: 0.05
    z_rand: 0.10
    z_short: 0.05


    resample_interval: 1
    max_particles: 500 # 5000->500 (operador, CPU): laptop saturado. 500 localiza no mapa e alivia MUITO o filtro.
    min_particles: 250
    recovery_alpha_fast: 0.1
    # 2026-07-23: 0.1 -> 0.001. Com slow == fast a razao w_fast/w_slow fica ~1
    # e a injecao de recuperacao (1 - w_fast/w_slow) NUNCA dispara — o filtro
    # ficava preso em bacia errada sem mecanismo de escape (teoria: slow<<fast,
    # valores canonicos 0.001/0.1).
    recovery_alpha_slow: 0.001
    # 0.2 -> 0.05 (2026-08-03): com 0.2 o AMCL CONGELAVA map->odom durante os
    # movimentos finos do docking (passos < 20cm/11deg nao disparavam update) e
    # o refino via LiDAR brigava com uma pose global defasada. 0.05 atualiza a
    # cada 5cm/3deg; 500 particulas seguram o custo na CPU do notebook.
    update_min_a: 0.05
    update_min_d: 0.05
