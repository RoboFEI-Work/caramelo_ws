# Servidores do Keepout Filter (RK-04) — paredes virtuais invisiveis ao LiDAR
# (ex.: fita zebrada de piso, que tem altura zero e nao aparece no scan).
#
# So sobem quando use_keepout:=true. O yaml_filename da mascara e' injetado
# pelo launch a partir de maps/<mapa>/keepout_mask.yaml (ver
# docs/keepout_paredes_virtuais.md e o script init_keepout_mask.py).

# map_server dedicado que publica a mascara como OccupancyGrid.
filter_mask_server:
  ros__parameters:
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    # yaml_filename e' definido no launch (depende do mapa escolhido).

# Publica o CostmapFilterInfo que o plugin KeepoutFilter dos costmaps consome.
costmap_filter_info_server:
  ros__parameters:
    type: 0                          # 0 = keepout / faixas preferenciais
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    # Mascara em modo 'scale': pixel preto (valor 100) => celula letal (keepout),
    # branco (0) => sem efeito. base/multiplier mapeiam valor->custo linearmente.
    base: 0.0
    multiplier: 1.0
