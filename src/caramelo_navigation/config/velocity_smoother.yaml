velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"

    # Limites da base mecanum do Caramelo (2026-08-03, pos-fix do firmware):
    # - wz max 0.50 casa com o max_vel_theta do DWB (o behavior_server publica
    #   direto aqui; sem isso um spin sairia a 0.9 e o AMCL perdia o yaw);
    # - min x -0.16: folga de re p/ o BackUp (0.13) nao ser clampado.
    # - deadband PEQUENO de proposito. NAO subir para o piso do ESC (0.1215/
    #   0.315): verificacao 2026-08-03 provou 3 quebras — (1) BackUp dos BTs
    #   (0.13) zerado; (2) RotationShim rampa do odom em passos de 0.10 e nunca
    #   cruzaria 0.315 = deadlock; (3) diagonais mecanum validas (norma >=
    #   min_speed_xy, eixos < 0.1215) viram (0,0). O piso fisico e POR RODA e
    #   quem o aplica certo e o driver (clamp-up por roda); sustentado sub-piso
    #   ja e bloqueado pelo min_speed do DWB.
    # x,y: 0.20/0.16 -> 0.40 (operador, 2026-09-14). Tem que acompanhar o DWB:
    # o smoother e' o ULTIMO clamp antes do cmd_vel, entao um teto velho aqui
    # anularia o aumento. wz MANTIDO em 0.50 (pedido do operador).
    max_velocity: [0.40, 0.40, 0.50]
    # x fica em -0.16: re' so' existe para o BackUp dos BTs (0.13), nao para
    # navegar (scan cobre so' a frente). y acompanha o max_vel_y para a lateral
    # ser simetrica nos dois sentidos.
    min_velocity: [-0.16, -0.40, -0.50]
    # x,y dobrados junto com o DWB (2026-09-14). E' AQUI que a rampa acontece de
    # fato: o DWB usa o StandardTrajectoryGenerator, que amostra a faixa inteira
    # de velocidade e so' usa a aceleracao para SIMULAR a trajetoria — quem ramp
    # o /cmd_vel de verdade e' este no. Angular MANTIDO (giro nao muda).
    max_accel: [0.70, 0.70, 2.0]
    max_decel: [-0.90, -0.90, -2.0]
    deadband_velocity: [0.005, 0.005, 0.01]

    odom_topic: "/odom"
    odom_duration: 0.1
    velocity_timeout: 1.0
