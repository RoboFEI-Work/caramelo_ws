velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"

    # Limites iniciais conservadores para a base mecanum do Caramelo.
    max_velocity: [0.20, 0.16, 0.70]
    min_velocity: [-0.12, -0.16, -0.70]
    max_accel: [0.35, 0.35, 1.20]
    max_decel: [-0.45, -0.45, -1.40]
    deadband_velocity: [0.005, 0.005, 0.01]

    odom_topic: "/odom"
    odom_duration: 0.1
    velocity_timeout: 1.0
