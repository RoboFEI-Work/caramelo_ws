planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false

    # IDs de planners disponiveis para selecao pelo BT/RViz.
    planner_plugins: ["GridBased", "ThetaStar"]

    # Exemplo desativado de planner Dijkstra.
    # GridBased:
    #   plugin: "bumperbot_planning::DijkstraPlanner"

    # Exemplo desativado de planner A*.
    # GridBasedFast:
    #   plugin: "bumperbot_planning::AStarPlanner"

    # Exemplo desativado de planner D*.
    # GRidBased:
    #   plugin: ""

    # ============================================================
    # Smac State Lattice Planner - HOLONOMICO / MECANUM
    # ============================================================
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice" # Plugin Lattice; em Iron ou anterior use "/".
      allow_unknown: true                 # Permite planejar por espaco desconhecido.
      tolerance: 0.25                     # Tolerancia de distancia se nao alcancar o goal exato.
      max_iterations: 1000000             # Maximo de iteracoes antes de falhar.
      max_on_approach_iterations: 1000    # Tentativas extras quando ja esta perto do goal.
      max_planning_time: 5.0              # Tempo maximo para planejar e suavizar em segundos.
      analytic_expansion_ratio: 3.5       # Frequencia das expansoes analiticas na aproximacao final.
      analytic_expansion_max_length: 3.0  # Comprimento maximo permitido na expansao analitica.
      analytic_expansion_max_cost: 200.0  # Maior custo aceito em uma expansao analitica.
      analytic_expansion_max_cost_override: false # Permite ignorar o custo maximo perto do goal.
      downsample_obstacle_heuristic: true # Acelera a heuristica com pequena perda de qualidade.
      use_quadratic_cost_penalty: false   # Usa penalidade de custo linear, nao quadratica.
      reverse_penalty: 2.0                # Penalidade para primitivas em re; deve ser >= 1.
      change_penalty: 0.05                # Penalidade para trocar a direcao do movimento.
      non_straight_penalty: 1.05          # Penalidade para primitivas nao retas; deve ser >= 1.
      cost_penalty: 2.0                   # Evita custos altos e favorece o centro dos corredores.
      rotation_penalty: 5.0               # Penaliza giro no lugar quando a primitive permite.
      retrospective_penalty: 0.015        # Prefere manobras tardias para reduzir a busca.
      lattice_filepath: "/opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/omni/output.json" # Primitivas omni compativeis com o mapa estatico de 5 cm.
      lookup_table_size: 20.0             # Janela em metros da tabela de distancias em cache.
      cache_obstacle_heuristic: false     # Reutiliza heuristica de obstaculos entre replans do mesmo goal.
      allow_reverse_expansion: false      # Habilita expansao reversa espelhada das primitivas.
      coarse_search_resolution: 1         # Numero de bins pulados na busca de orientacao final.
      goal_heading_mode: "DEFAULT"        # DEFAULT, BIDIRECTIONAL ou ALL_DIRECTION.
      smooth_path: true                   # Executa o smoother interno do State Lattice.
      smoother:
        max_iterations: 1000              # Maximo de iteracoes do smoother interno.
        w_smooth: 0.3                     # Peso que deixa o caminho mais suave.
        w_data: 0.2                       # Peso que mantem o caminho original.
        tolerance: 1.0e-10                # Tolerancia de convergencia do smoother.
        do_refinement: true               # Refina o caminho depois da primeira suavizacao.
        refinement_num: 2                 # Numero de passagens extras de refinamento.

    # ============================================================
    # Theta Star Planner - holonomico em grade 2D
    # ============================================================
    ThetaStar:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner" # Planner 2D de segmentos em qualquer angulo.
      how_many_corners: 8                 # Usa conectividade de oito vizinhos na grade.
      w_euc_cost: 1.0                     # Peso aplicado ao comprimento euclidiano do caminho.
      w_traversal_cost: 2.0               # Penalidade para atravessar celulas mais caras.
      allow_unknown: true                 # Permite planejar por espaco desconhecido.
      terminal_checking_interval: 5000    # Iteracoes entre checagens de cancelamento ou timeout.
      # ThetaStar no Nav2 Jazzy nao possui o parametro w_heuristic_cost.

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: "[[0.355, 0.235], [0.355, -0.235], [-0.355, -0.235], [-0.355, 0.235]]"
      footprint_padding: 0.0
      resolution: 0.02
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.245
        cost_scaling_factor: 30.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: True
