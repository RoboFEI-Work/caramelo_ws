bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.6
    # 20 -> 300ms (2026-08-07): com o notebook sob pico de carga (ex.: driver
    # da camera reiniciando), 20ms de espera pelo ACK dos action servers
    # derrubava a navegacao em cascata ("Timed out waiting to acknowledge
    # compute_path_to_pose" -> dock abortado em 6s). 300ms tolera o soluco;
    # o custo e so latencia de INICIO de cada acao do BT no pior caso.
    default_server_timeout: 300
    bt_loop_duration: 10
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

    plugin_lib_names:
      - opennav_dock_action_bt_node
      - opennav_undock_action_bt_node

    # O launch escolhe a BT padrao com nav_profile:=dwb ou nav_profile:=mppi.
    #
    # Plugins cadastrados para testes:
    # planner_id: SmacLattice, ThetaStar
    # controller_id: FollowPath, DWBHolonomic, MPPIHolonomic
    # goal_checker_id padrao no BT: general_goal_checker, para respeitar yaw com folga.
    # smoother_id padrao no BT: savitzky_golay_smoother; simple_smoother fica como fallback.
    #
    # caramelo_lattice_dwb.xml: SmacLattice + DWBHolonomic como DEFAULT; o
    # caramelo_lattice_mppi.xml: SmacLattice + MPPIHolonomic como DEFAULT; ambos
    # tem ControllerSelector — o painel Selector do RViz troca o controlador ao
    # vivo (topico controller_selector), sem relancar.
    # simple_navigation*.xml ficam como exemplos/experimentos.
