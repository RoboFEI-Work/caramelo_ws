bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.3
    default_server_timeout: 20
    bt_loop_duration: 10
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

    # Plugins cadastrados para testes:
    # planner_id: GridBased, ThetaStar
    # controller_id: FollowPath, DWBHolonomic, MPPIHolonomic
    # smoother_id: simple_smoother, savitzky_golay_smoother
    #
    # Os XMLs customizados em behavior_tree/ fixam GridBased e FollowPath.
    # Para selecionar IDs diferentes nesses XMLs, substitua os valores fixos
    # por portas de blackboard e adicione um no SmoothPath com smoother_id.
    # Esta configuracao nao altera a arvore BT automaticamente.
