smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother", "savitzky_golay_smoother"] # IDs de smoothers disponiveis.

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" # Smoother original do projeto.
      tolerance: 1.0e-10                       # Tolerancia de convergencia.
      max_its: 1000                            # Maximo de iteracoes.
      do_refinement: true                      # Refina o path apos suavizar.

    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother" # Filtro rapido para pequenas irregularidades.
      window_size: 7                           # Janela impar de pontos usada pelo filtro.
      poly_order: 3                            # Ordem do polinomio ajustado na janela.
      do_refinement: true                      # Refina o resultado apos a primeira suavizacao.
      refinement_num: 2                        # Numero de passagens extras de suavizacao.
      enforce_path_inversion: false            # Nao preserva inversoes cinematicas do path.
