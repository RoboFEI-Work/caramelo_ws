collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_smoothed"
    cmd_vel_out_topic: "/cmd_vel"
    state_topic: "/collision_monitor_state"
    transform_tolerance: 0.6
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    # AJUSTAR_NO_ROBO: comece conservador, teste com rodas suspensas e area livre.
    polygons: ["PolygonStop", "FootprintApproach"]
    # PolygonStop DESLIGADO (2026-07-20): zona de STOP estatica (direcao-cega)
    # travava a RE de escape — o obstaculo em que o robo encostava ficava
    # dentro dela e ela mandava parar tudo, inclusive a ré que ia p/ LONGE do
    # obstaculo. O FootprintApproach abaixo e projetado pela velocidade (sabe
    # a direcao): freia so quando o movimento aponta p/ o obstaculo, e libera
    # a ré. Protecao mantida, escape destravado.
    PolygonStop:
      type: "polygon"
      points: "[[0.45, 0.30], [0.45, -0.30], [-0.25, -0.30], [-0.25, 0.30]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "/collision_monitor/stop_polygon"
      enabled: false
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: true
      polygon_pub_topic: "/collision_monitor/footprint_approach"
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: true
