collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_smoothed"
    cmd_vel_out_topic: "/cmd_vel"
    state_topic: "/collision_monitor_state"
    transform_tolerance: 0.6
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    # AJUSTAR_NO_ROBO: comece conservador, teste com rodas suspensas e area livre.
    polygons: ["PolygonStop", "FootprintApproach"]
    # PolygonStop DESLIGADO (2026-07-20): zona de STOP estatica (direcao-cega)
    # travava a RE de escape — o obstaculo em que o robo encostava ficava
    # dentro dela e ela mandava parar tudo, inclusive a ré que ia p/ LONGE do
    # obstaculo. O FootprintApproach abaixo e projetado pela velocidade (sabe
    # a direcao): freia so quando o movimento aponta p/ o obstaculo, e libera
    # a ré. Protecao mantida, escape destravado.
    PolygonStop:
      type: "polygon"
      points: "[[0.45, 0.30], [0.45, -0.30], [-0.25, -0.30], [-0.25, 0.30]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "/collision_monitor/stop_polygon"
      enabled: false
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # HEADWAY: o monitor projeta o footprint pela velocidade atual por este
      # tempo e freia se preve toque. Subiu para 1.5 quando o teto era 0.70 m/s
      # (0,78 s so' de frenagem deixava 1.2 sem folga) e VOLTOU para 1.2 com o
      # teto em 0.40: agora a parada leva 0,44 s e, com a latencia do smoother a
      # 20 Hz (~0,15 s), 1.2 s da' o dobro do tempo necessario — 0,48 m de
      # projecao contra 0,09 m de parada. Manter 1.5 aqui so' faria o robo
      # comecar a frear cedo demais perto de mesa e parede.
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: true
      polygon_pub_topic: "/collision_monitor/footprint_approach"
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: true
