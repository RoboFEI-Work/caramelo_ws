behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # RK-05: Spin e BackUp DESABILITADOS de proposito. Uma recovery que gira ou
    # recua perto de parede pode colidir, e colisao custa metade da pontuacao.
    # Preferimos falhar parado a "se salvar" colidindo. Mantemos so o Wait; a
    # limpeza de costmap (ClearEntireCostmap) continua no proprio behavior tree.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.6
    use_sim_time: false
    simulate_ahead_time: 2.0
