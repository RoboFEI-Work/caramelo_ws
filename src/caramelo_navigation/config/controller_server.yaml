controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0 # Frequencia de controle em Hz.
    min_x_velocity_threshold: 0.001 # Ignora ruido muito pequeno em vx.
    min_y_velocity_threshold: 0.001 # Permite comando lateral do mecanum.
    min_theta_velocity_threshold: 0.001 # Ignora ruido muito pequeno em wz.
    failure_tolerance: 0.3 # Tempo maximo de falha antes de abortar.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["position_goal_checker", "general_goal_checker"]
    controller_plugins: ["DWBHolonomic", "FollowPath", "MPPIHolonomic"] # DWB e o principal; RPP/MPPI ficam experimentais.
    odom_topic: /odom

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker" # Verifica se o robo continua avancando.
      required_movement_radius: 0.10 # 0.5->0.10: 10cm ja conta como progresso (nav normal reseta facil); detecta travamento real mais cedo.
      movement_time_allowance: 6.0 # 10->6: dispara a recovery (backup) em 6s em vez de 10s, mas ainda cabe uma rotacao final saudavel (~3s com slowing_factor 8).

    position_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker" # Para goals de RViz em que importa chegar no ponto, nao no yaw.
      # 0.04 -> 0.10 (2026-08-03): este e o checker DEFAULT (1o da lista) e o
      # staging do docking cai nele. 4cm < ruido do AMCL (~16cm) e < passo
      # minimo executavel (piso 0.1215 m/s) -> "Failed to make progress" no
      # pre-dock (round 1 do gauntlet). 10cm e o valor ja comprovado no
      # general_goal_checker (2026-07-21); precisao final = approach + align.
      xy_goal_tolerance: 0.10
      stateful: true # Mantem o goal aceito depois que entra na janela.

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker" # Verifica posicao e orientacao finais.
      # 0.05->0.10 (2026-07-21): ruido de posicao do AMCL e ~16cm; janela de
      # 5cm menor que o ruido fazia o goal de staging do docking NUNCA fechar
      # (micro-ajustes abaixo do piso do ESC). 10cm fecha; a precisao final na
      # bancada e do approach do docking + align.
      xy_goal_tolerance: 0.10
      # 0.20 (11.5 graus) e o MINIMO CONFIAVEL: a incerteza de yaw do AMCL e
      # ~10 graus; janela menor que o ruido (testado 0.12 em 2026-07-21) faz o
      # robo GIRAR SEM ASSENTAR no goal (visto na staging do docking). Precisao
      # fina de orientacao na bancada e papel do approach do docking, nao do
      # goal checker.
      yaw_goal_tolerance: 0.20
      stateful: true # Mantem a posicao concluida enquanto alinha yaw.

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController" # Experimental para comparacao.
      desired_linear_vel: 0.2 # Velocidade linear maxima em m/s.
      lookahead_dist: 0.6 # Distancia base do ponto de perseguicao.
      min_lookahead_dist: 0.3 # Menor lookahead permitido.
      max_lookahead_dist: 0.9 # Maior lookahead permitido.
      lookahead_time: 1.5 # Tempo usado no lookahead por velocidade.
      rotate_to_heading_angular_vel: 1.8 # Velocidade de giro para alinhar ao path.
      transform_tolerance: 0.6 # Atraso de TF aceito em segundos.
      use_velocity_scaled_lookahead_dist: false # Mantem lookahead fixo.
      min_approach_linear_velocity: 0.05 # Velocidade minima ao aproximar do goal.
      approach_velocity_scaling_dist: 1.0 # Distancia onde reduz velocidade no goal.
      use_collision_detection: true # Verifica colisao ate o ponto de perseguicao.
      max_allowed_time_to_collision_up_to_carrot: 1.0 # Horizonte de colisao em segundos.
      use_regulated_linear_velocity_scaling: true # Reduz velocidade em curvas.
      use_cost_regulated_linear_velocity_scaling: true # Reduz velocidade perto de custos altos.
      regulated_linear_scaling_min_radius: 0.9 # Raio de curva que inicia reducao.
      regulated_linear_scaling_min_speed: 0.05 # Menor velocidade em curva.
      use_fixed_curvature_lookahead: false # Usa o lookahead normal para curvatura.
      curvature_lookahead_dist: 1.0 # Distancia usada se o lookahead fixo for ativado.
      use_rotate_to_heading: true # Gira antes de seguir caminhos com angulo alto.
      rotate_to_heading_min_angle: 0.785 # Angulo minimo para girar no lugar.
      max_angular_accel: 3.2 # Aceleracao angular maxima.
      max_robot_pose_search_dist: 10.0 # Trecho maximo do path procurado perto do robo.
      interpolate_curvature_after_goal: false # Nao interpola curvatura depois do goal.
      cost_scaling_dist: 0.85 # Deve acompanhar o raio da inflation layer ampla.
      cost_scaling_gain: 1.0 # Ganho da reducao por custo.
      inflation_cost_scaling_factor: 3.0 # Deve acompanhar a inflation layer.

    DWBHolonomic:
      # RotationShim (2026-07-21): "de costas" para o caminho, o DWB nao girava
      # (criticos brigando) e quando girava escolhia o lado LONGO (Oscillation
      # trava a direcao). O shim gira NO LUGAR pelo lado MAIS CURTO quando o
      # erro de rumo passa de angular_dist_threshold, e so entao entrega ao
      # DWB. rotate_to_goal_heading tambem faz o giro final pelo lado curto.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner" # Controlador principal por amostragem para mecanum.
      # REVERTIDO 30->45 graus: com 30 o shim engajava perto da bancada, a
      # checagem de colisao do giro (zona inflada) bloqueava, FollowPath falhava
      # e a recovery dava RE CEGA em direcao a mesa (robo "dockando de costas").
      # A ronda completa validada rodou com 45. O giro-pelo-lado-longo ocasional
      # do DWB abaixo de 45 e um custo aceito por ora.
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5 # Ponto do caminho usado para medir o rumo.
      # 0.6 -> 0.5 (2026-08-03): igual ao wz max do smoother e ao max_vel_theta
      # do DWB (0.6 era pedido de torque da era pre-fix do firmware; o smoother
      # clampava em 0.5 de qualquer forma).
      rotate_to_heading_angular_vel: 0.5
      # 2.0 -> 7.0 (2026-08-03): o shim acelera em degraus de accel/20Hz A
      # PARTIR DO ODOM. Com 2.0 o degrau era 0.1 rad/s — dentro da zona neutra
      # do driver (<0.5x piso = 0.157) -> pulso neutro, robo parado, odom 0,
      # shim repete 0.1 = DEADLOCK (visto no gauntlet: "Failed to make
      # progress" em loop a caminho do FINISH). Com 7.0 o 1o degrau e 0.35 >=
      # piso 0.315: o giro parte no primeiro ciclo.
      max_angular_accel: 7.0
      simulate_ahead_time: 1.0 # Checa colisao do giro no costmap antes de girar.
      rotate_to_goal_heading: true # Giro final do goal tambem pelo lado curto.
      debug_trajectory_details: true # Publica detalhes das trajetorias para depuracao.
      # RE PROIBIDA: o scan util cobre so os 180 graus FRONTAIS (scan_normalizer
      # na Pi corta a metade traseira). Dar re e andar cego — houve colisao
      # traseira real em teste. Se um dia houver sensor traseiro, reavaliar.
      min_vel_x: 0.0 # Velocidade minima em x (sem re).
      max_vel_x: 0.20 # Velocidade maxima em x.
      min_vel_y: -0.16 # Velocidade minima lateral.
      max_vel_y: 0.16 # Velocidade maxima lateral.
      max_vel_theta: 0.50 # 1.0->0.5 (operador): giro no eixo lento o bastante p/ o AMCL acompanhar durante a rotacao (mapa duplicado erra yaw se varre rapido) e nao passar do alvo no alinhamento final.
      # Pisos casados com o ESC (2026-08-03, firmware novo: piso 650rpm =
      # 0.1215 m/s / 0.315 rad/s de corpo, EXECUTADO exato apos o fix do mapa).
      # min_speed = 1.08x o piso fisico: o DWB nunca emite comando que o driver
      # nao consiga executar (abaixo disso as rodas zeravam e o robo congelava
      # com "Failed to make progress").
      min_speed_xy: 0.131 # 1.08 x piso fisico 0.1215 m/s.
      max_speed_xy: 0.20 # Limite do modulo da velocidade linear.
      min_speed_theta: 0.34 # 1.08 x piso fisico 0.315 rad/s.
      acc_lim_x: 0.35 # Aceleracao maxima em x.
      decel_lim_x: -0.45 # Desaceleracao maxima em x.
      acc_lim_y: 0.35 # Aceleracao maxima lateral.
      decel_lim_y: -0.45 # Desaceleracao maxima lateral.
      acc_lim_theta: 2.0 # Aceleracao angular maxima para girar com mais decisao.
      decel_lim_theta: -2.0 # Desaceleracao angular maxima para parar o giro com firmeza.
      vx_samples: 8 # Amostras de velocidade em x.
      vy_samples: 8 # Amostras de velocidade lateral.
      vtheta_samples: 20 # Amostras angulares.
      # 8x8x20 = 1280 trajetorias/ciclo (2026-07-21: o laptop nao segurava 20Hz
      # com 3000; 1280 corta ~57% do custo do loop). Historico: 20x20x30=12000
      # dava ~3Hz; 10x10x30=3000 dava ~9-13Hz com RViz aberto.
      sim_time: 1.7 # Horizonte de simulacao em segundos.
      linear_granularity: 0.05 # Passo linear da simulacao.
      angular_granularity: 0.025 # Passo angular da simulacao.
      transform_tolerance: 0.6 # Atraso de TF aceito em segundos.
      # 0.05 -> 0.03 (2026-08-03): precisa ficar ESTRITAMENTE MENOR que a
      # tolerancia de QUALQUER goal checker em uso (position 0.04, general
      # 0.10) — senao o RotateToGoal engaja a fase "slowing" antes do checker
      # fechar o goal, e com min_speed_xy 0.131 nao existe amostra translacional
      # "mais lenta que a atual" legal: o robo gira parado na borda do anel.
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.20 # Coerente com o general_goal_checker (11.5 graus).
      trans_stopped_velocity: 0.03 # Exige quase parar antes do RotateToGoal dominar.
      short_circuit_trajectory_evaluation: true # Interrompe trajetorias ja piores.
      stateful: true # Mantem estado ao aproximar do goal.
      # ObstacleFootprint (nao BaseObstacle): avalia o FOOTPRINT real 0.79x0.39 m
      # contra o costmap, em vez do custo no CENTRO do robo. Com BaseObstacle o
      # centro entrava na zona inflada perto de caixas e TODAS as trajetorias
      # viravam invalidas — robo congelava a ~0.3 m do obstaculo.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "Twirling"] # Criticos usados para pontuar trajetorias.
      ObstacleFootprint.scale: 0.02 # Peso para custo de obstaculos.
      PathAlign.scale: 14.0 # 8->14: alinha o rumo ao path mais cedo (menos arco tipo carro / "anda reto demais").
      PathAlign.forward_point_distance: 0.2 # 0.1->0.2: antecipa a curva olhando um pouco mais a frente.
      GoalAlign.scale: 8.0 # Reduz alinhamento translacional agressivo perto do goal.
      GoalAlign.forward_point_distance: 0.1 # Ponto a frente usado no goal.
      PathDist.scale: 24.0 # Peso para manter proximo ao path.
      GoalDist.scale: 18.0 # Peso para reduzir distancia ate o goal.
      RotateToGoal.scale: 32.0 # Fortalece giro no proprio eixo para alinhar yaw final.
      RotateToGoal.slowing_factor: 8.0 # 4->8: freia mais cedo no giro final (limita a vel angular perto do alvo, evita passar do yaw).
      RotateToGoal.lookahead_time: -1.0 # Usa a simulacao completa no giro final.
      # ADR-01 item 4: numa base mecanum o Twirling penaliza girar quando daria
      # para transladar (inclusive de lado), evitando que o DWB "rode como
      # diferencial". Escala BAIXA para nao brigar com o RotateToGoal (32.0) do
      # alinhamento final. AJUSTAR_NO_ROBO: subir se o robo girar demais no meio
      # do caminho, baixar se demorar a alinhar o yaw no goal.
      # 2.0 -> 1.0: com a re proibida, girar virou obrigatorio para progredir;
      # operador reportou "demora pra virar" perto de obstaculo.
      Twirling.scale: 1.0 # Peso (baixo) contra giro desnecessario no meio do trajeto.

    MPPIHolonomic:
      plugin: "nav2_mppi_controller::MPPIController" # Experimental para mecanum.
      time_steps: 40 # 56->40 (horizonte 2.0s; CPU do laptop nao segura 2000x56).
      model_dt: 0.05 # Intervalo entre pontos em segundos.
      batch_size: 1200 # 2000->1200 (CPU; DWB com 1280 trajetorias roda ~15-20Hz aqui).
      iteration_count: 1 # Iteracoes de otimizacao por ciclo.
      vx_std: 0.1 # Ruido de amostragem em vx.
      vy_std: 0.1 # Ruido de amostragem em vy.
      wz_std: 0.2 # Ruido de amostragem em wz.
      vx_max: 0.2 # Velocidade maxima em x.
      vx_min: 0.0 # Sem re: scan cobre so a frente (mesmo racional do DWB).
      vy_max: 0.2 # Velocidade maxima lateral.
      wz_max: 1.0 # Velocidade angular maxima.
      ax_max: 0.5 # Aceleracao maxima em x.
      ax_min: -0.5 # Desaceleracao maxima em x.
      ay_max: 0.5 # Aceleracao maxima lateral.
      ay_min: -0.5 # Desaceleracao maxima lateral.
      az_max: 1.5 # Aceleracao angular maxima.
      prune_distance: 1.7 # Remove trecho distante atras do robo.
      transform_tolerance: 0.6 # Atraso de TF aceito em segundos.
      temperature: 0.3 # Explora trajetorias menos provaveis.
      gamma: 0.015 # Peso do esforco de controle.
      motion_model: "Omni" # Modelo holonomico para base mecanum.
      visualize: true # Publica trajetorias avaliadas para o RViz.
      regenerate_noises: false # Reutiliza ruido para reduzir custo de CPU.
      TrajectoryVisualizer:
        trajectory_step: 5 # Mostra uma a cada cinco trajetorias.
        time_step: 3 # Mostra um a cada tres passos temporais.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"] # Criticos usados para avaliar trajetorias.
      ConstraintCritic:
        enabled: true # Penaliza comandos fora dos limites.
        cost_power: 1 # Expoente do custo.
        cost_weight: 4.0 # Peso do limite cinematico.
      CostCritic:
        enabled: true # Penaliza proximidade de obstaculos.
        cost_power: 1 # Expoente do custo.
        cost_weight: 3.81 # Peso do custo do costmap.
        near_collision_cost: 253 # Custo que indica quase colisao.
        critical_cost: 300.0 # Custo critico da trajetoria.
        consider_footprint: true # Usa o footprint SE2 na colisao.
        collision_cost: 1000000.0 # Penalidade para colisao.
        near_goal_distance: 1.0 # Distancia onde reduz esse custo perto do goal.
        trajectory_point_step: 2 # Intervalo de pontos verificados no costmap.
      GoalCritic:
        enabled: true # Penaliza distancia restante ao goal.
        cost_power: 1 # Expoente do custo.
        cost_weight: 5.0 # Peso da distancia ate o goal.
        threshold_to_consider: 1.4 # Ativa dentro desta distancia do goal.
      GoalAngleCritic:
        enabled: true # Penaliza erro de orientacao final.
        cost_power: 1 # Expoente do custo.
        cost_weight: 3.0 # Peso da orientacao final.
        threshold_to_consider: 0.5 # Ativa perto do goal.
      PathAlignCritic:
        enabled: true # Mantem a trajetoria alinhada ao path.
        cost_power: 1 # Expoente do custo.
        cost_weight: 14.0 # Peso do alinhamento.
        max_path_occupancy_ratio: 0.05 # Rejeita path quase todo ocupado.
        trajectory_point_step: 4 # Intervalo de pontos avaliados.
        threshold_to_consider: 0.5 # Ativa quando perto do path.
        offset_from_furthest: 20 # Ponto do path usado como referencia.
        use_path_orientations: false # Nao exige orientacao do path global.
      PathFollowCritic:
        enabled: true # Incentiva progresso pelo path.
        cost_power: 1 # Expoente do custo.
        cost_weight: 5.0 # Peso do progresso.
        offset_from_furthest: 5 # Ponto futuro usado como referencia.
        threshold_to_consider: 1.4 # Ativa longe do goal.
      PathAngleCritic:
        enabled: true # Penaliza angulo ruim em relacao ao path.
        cost_power: 1 # Expoente do custo.
        cost_weight: 2.0 # Peso do angulo do path.
        offset_from_furthest: 4 # Ponto futuro usado para calcular angulo.
        threshold_to_consider: 0.5 # Ativa longe do goal.
        max_angle_to_furthest: 1.0 # Maior angulo aceito ate o ponto futuro.
        mode: 0 # Usa o modo padrao de angulo do path.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      transform_tolerance: 0.6 # EKF da Pi tem picos de atraso de TF (~0.5s)
      width: 3
      height: 3
      resolution: 0.02
      footprint: "[[0.395, 0.055], [0.395, -0.055], [0.285, -0.055], [0.285, -0.195], [-0.285, -0.195], [-0.285, 0.195], [0.285, 0.195], [0.285, 0.055]]"
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # AJUSTAR_NO_ROBO: 0.85 -> 0.55, mesmo racional do costmap global (o robo
        # congelava dentro da zona inflada perto de caixas).
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true
