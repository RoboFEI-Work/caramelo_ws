# MoveIt uses this configuration for controller management

# 2026-08-07: braco REAL (Dynamixel) executa mais devagar que o perfil
# planejado — o monitor default (scaling ~1.1 + margem 0.5s) cancelava a
# trajetoria em pleno movimento saudavel ("Controller is taking too long...
# expected upper bound 5.47s", missao 3-objetos). 3x + 3s de margem cobre a
# folga real; o monitor continua ligado como rede contra braco travado.
trajectory_execution:
  allowed_execution_duration_scaling: 3.0
  allowed_goal_duration_margin: 3.0
  # 2026-10-27: com 3,0 rad/s e o barramento a 100 Hz o JTC da Pi devolve
  # SUCCEEDED com os servos ainda convergindo (goal 0,30 rad), e o move_group
  # recusava a trajetoria SEGUINTE com "start point deviates from current
  # robot state more than 0.01" (3x num pick do tour de 27/10, bloco preso na
  # garra; zero recusas em 451 execucoes antes de 26/10). A correcao principal
  # esta nos nos (arm_settle.hpp: esperam o braco PARAR antes de planejar);
  # 0,03 rad (1,7 graus, ~20 ticks do XM540) e' a rede para a deriva residual
  # e para quem nao passa pela espera (go_to_named_pose_bt, commander).
  allowed_start_tolerance: 0.03

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    joints:
      - manip_joint1
      - manip_joint2
      - manip_joint3
      - manip_joint4
      - manip_joint5
    action_ns: follow_joint_trajectory
    default: true
    
  gripper_controller:
    type: FollowJointTrajectory
    joints:
      - manip_joint6
      - manip_joint7
    action_ns: follow_joint_trajectory
    default: true