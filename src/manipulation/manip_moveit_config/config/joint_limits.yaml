# joint_limits.yaml: limites de velocidade/aceleracao que o move_group aplica
# por cima da URDF (chaves: max_position, min_position, max_velocity,
# max_acceleration; has_*_limits desliga).

# Fatores default 1.0: movimento que nao seta o fator explicitamente (RViz,
# MGIs sem setMaxVelocityScalingFactor) rodava a 10% dos limites abaixo com o
# antigo 0.1. A velocidade fisica maxima continua sendo max_velocity/
# max_acceleration por junta.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

# Juntas 1-5: 1.2 rad/s e 1.0 rad/s2 (pedido de velocidade maxima, medido
# 2026-09-02). O plano pode correr na frente do braco: o monitor 3x+3s
# (moveit_controllers) e o goal_time 5s + goal 0.30 rad do JTC (Pi) absorvem o
# atraso; o JTC nao tem tolerancia de trajeto, entao nao aborta no meio.
# Se aparecer "taking too long" ou GOAL_TOLERANCE_VIOLATED, voltar para
# 0.9/0.6. O teto FISICO esta nos servos (Profile Velocity/Accel na EEPROM +
# ganho P); destravar isso e' no Dynamixel Wizard, nao aqui.
# Garra (6/7): 1.0/1.0, movimentos curtos, nunca estourou o monitor.
joint_limits:
  manip_joint1:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint2:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint3:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint4:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint5:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint6:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  manip_joint7:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0