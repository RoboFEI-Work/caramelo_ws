# Mock do braco no PC — derivado do caramelo_controllers.yaml da Pi
# (raspberry_bringup), SEM o mecanum_controller: mock e so do manipulador,
# navegacao fica de fora. Estrutura/valores identicos para o comportamento
# do PC espelhar o robo.
controller_manager:
  ros__parameters:
    # Mesma taxa da Pi (100Hz). Os controllers do braco rodam a 25Hz (abaixo).
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_dynamic_joint_states: true

arm_controller:
  ros__parameters:
    # Na Pi, 25Hz por limite do Dynamixel. Mock nao tem esse limite, mas
    # manter identico evita surpresas de timing entre PC e robo.
    update_rate: 25
    joints:
      - manip_joint1
      - manip_joint2
      - manip_joint3
      - manip_joint4
      - manip_joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_nonzero_velocity_at_trajectory_end: true

gripper_controller:
  ros__parameters:
    # Mesma limitacao espelhada do arm_controller (ver acima).
    update_rate: 25
    joints:
      - manip_joint6
      - manip_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_nonzero_velocity_at_trajectory_end: true
