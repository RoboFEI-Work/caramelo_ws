# Detector do BURACO da mesa de precision placement — pp_hole_detector_node.py
#
# Como funciona: tampo BRANCO com a cavidade MARROM (fundo de madeira). A
# imagem da RealSense vai a HSV, a mascara marrom vira manchas, e so' passa a
# mancha ~quadrada do tamanho da cavidade CERCADA DE BRANCO (anel) — o chao
# marrom da arena nao tem anel branco e cai fora. O centro de cada mancha e'
# projetado (ray-cast) no plano do tampo (z de /manip/pp_plane_z, publicado
# pelo place; sem ele plane_z_default) e sai em
# /manip/pp_hole_detector/holes (PoseArray em manip_base_link) + TFs
# pp_buraco_<i>. O mtc_place_action_node corrige o alvo xy do slot pelo
# buraco mais proximo (slot_hole_* la').
#
# TUDO aqui e' parametro ROS reajustavel ao vivo:
#   ros2 param set /pp_hole_detector ring_white_min_frac 0.3
#   ros2 param set /pp_hole_detector h_ranges "[5, 30]"
# Para calibrar sem robo (foto da mesa de PP):
#   ros2 run manip_bringup pp_hole_detector_node.py --image foto.jpg --out overlay.png
#   ros2 run manip_bringup pp_hole_detector_node.py --image foto.jpg --probe 320,240
pp_hole_detector:
  ros__parameters:
    # --- ativacao / custo ---
    rate_hz: 3.0                 # frames processados por segundo (o resto e' descartado)
    always_on: false             # true = processa sempre (calibracao/bag); false = so durante o place
    process_scale: 0.5           # reduz a imagem antes de segmentar (640x480 -> 320x240)
    image_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    place_active_topic: /manip/place_active
    plane_z_topic: /manip/pp_plane_z
    debug_image: true            # publica /manip/pp_hole_detector/debug_image (so com assinante)
    # 2026-11-09: LIGADO para os testes da PP (1 imagem/s so' enquanto ha' place
    # ativo; ~100 kB cada). Serve para ajustar as cores com a camera real.
    # Voltar para "" antes da competicao.
    save_debug_dir: "/tmp/pp_hole_debug"
    save_debug_every_s: 1.0
    publish_tf: true             # TFs pp_buraco_<i> (RViz); o place usa o PoseArray

    # --- frames / plano ---
    base_frame: manip_base_link
    camera_frame: ""             # vazio = frame_id do CameraInfo
    plane_z_default: -0.029      # tampo da mesa 15 cm em manip_base_link (so' sem o place publicando)
    tf_timeout_s: 0.0
    reject_when_camera_moving: true
    camera_motion_max_m: 0.005
    camera_motion_max_deg: 1.0

    # --- cor do buraco (CALIBRAR NA ARENA com --probe em fotos reais) ---
    # Madeira/MDF pela RealSense costuma cair em H 8-20, S 60-180, V 60-180.
    h_ranges: [5, 25]            # pares [lo, hi, lo, hi, ...] (H 0-179)
    s_min: 50
    s_max: 255
    v_min: 40
    v_max: 230

    # --- anel branco (o filtro que separa buraco de chao marrom) ---
    ring_enabled: true
    ring_px: 6                   # espessura do anel em px escalados
    ring_white_min_frac: 0.45    # a tag adesiva ao lado come parte do anel; por isso nao e' 0.8
    white_s_max: 70              # "tampo branco": S baixo...
    white_v_min: 140             # ... e V alto

    # --- forma (cavidade ~quadrada) ---
    min_area_px: 150.0           # em px JA escalados (process_scale)
    min_solidity: 0.85           # cavidade cheia de madeira e' convexa
    max_aspect_ratio: 1.8        # quadrado em perspectiva estica; acima disso e' risco/sombra
    min_rectangularity: 0.60
    border_margin_px: 3
    accept_partial: false        # cortado pela borda/garra: centro visivel nao e' o centro da cavidade

    # --- morfologia (kernel em px escalados) ---
    morph_open_px: 3
    morph_close_px: 5
    morph_close_iters: 1

    # --- geometria 3D (MEDIR a cavidade real e ajustar hole_side_m) ---
    hole_side_m: 0.05            # lado nominal da cavidade
    side_tolerance_frac: 0.5
    area_expected_min_frac: 0.3  # area do blob vs area esperada a distancia d
    area_expected_max_frac: 4.0
    min_target_y_m: 0.10         # sanidade em manip_base_link (+Y = frente)
    max_target_radius_m: 0.60
    max_ray_length_m: 1.0

    # --- regioes da GARRA na imagem (mesmos poligonos do container_detector) ---
    exclusion_polys_norm:
      - "0.000,0.000 0.138,0.000 0.157,0.094 0.155,0.304 0.000,0.225"                          # dedo esquerdo
      - "0.841,0.000 1.000,0.000 1.000,0.140 0.867,0.277 0.838,0.279 0.795,0.113 0.789,0.023"  # dedo direito
    exclusion_polys_holding_norm:
      - "0.791,0.023 0.791,0.077 0.773,0.133 0.722,0.196 0.616,0.260 0.594,0.250 0.528,0.037 0.534,0.000 0.762,0.000"  # dedo direito fechado
      - "0.217,0.219 0.206,0.235 0.184,0.235 0.048,0.150 0.005,0.113 0.000,0.002 0.209,0.000"                          # dedo esquerdo fechado
      - "0.150,0.000 0.660,0.000 0.660,0.250 0.600,0.360 0.570,0.390 0.300,0.385 0.260,0.355 0.150,0.240"              # cubo carregado (+margem)
    exclusion_rects_norm: [0.30, 0.00, 0.62, 0.42]
    cube_rect_only_when_holding: true
    gripper_joint: manip_joint6
    gripper_holding_above: -0.12
    joint_states_topic: /joint_states

    # --- rastreio (varios buracos anonimos; mediana por rastro) ---
    track_match_dist_m: 0.03     # deteccao casa com o rastro a menos de 3 cm
    smoothing_n: 5
    smoothing_window_s: 2.5
    min_samples: 2               # rastro so' publica com 2+ amostras
