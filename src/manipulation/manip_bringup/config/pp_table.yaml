# Geometria da mesa de precisao (PP) - ARQUIVO DE CALIBRACAO, feito para editar na competicao.
# 2026-11-14 (pedido do operador): cada mesa tem erro de fabricacao; estes numeros sao a "regua"
# que a visao do alinhamento (scripts/pp_align_vision.py) usa para saber onde esta' o furo-alvo
# a partir dos furos VIZINHOS vistos pela camera. Tudo em milimetros.
#
# Como calibrar numa mesa nova (5 minutos, so' regua):
#   1. pitch_mm      = distancia centro a centro entre dois furos vizinhos (media de 2 ou 3 pares).
#   2. hole_side_mm  = lado do furo (paquimetro, por dentro).
#   3. cube_side_mm  = lado do cubo.
#   4. Se um furo estiver fora da grade (colado/usinado torto), ponha o desvio dele em
#      slot_correction_mm: [ao longo da fileira, atravessado], positivo no sentido do id maior
#      e no sentido tag -> furo.
# Conferencia sem regua: runs/pp_auditoria_20261114/metrologia2/medir.py mede passo/lado da tag e
# lado do furo/lado da tag numa imagem de perto (em 14/11: 3,43 e 1,330).
pp_table:
  pitch_mm: 109.0            # regua do operador em 14/11 (~109 mm)
  hole_side_mm: 42.3         # 1,330 x lado da tag (imagem) com o passo de 109 mm; conferir no paquimetro
  cube_side_mm: 42.0         # regulamento; conferir no paquimetro
  tag_black_side_mm: 31.8    # lado do QUADRADO PRETO da tag do slot = 109 / 3,43 (o adesivo tem ~40)
  tag_to_hole_mm: 46.0       # centro da tag -> centro do furo = 1,446 x lado da tag (imagem)
  slot_tags: [101, 102, 103, 104, 105, 106, 107]   # ordem dos slots ao longo da fileira
  slot_correction_mm:        # desvio de cada furo em relacao a' grade ideal (0 = na grade)
    101: [0.0, 0.0]
    102: [0.0, 0.0]
    103: [0.0, 0.0]
    104: [0.0, 0.0]
    105: [0.0, 0.0]
    106: [0.0, 0.0]
    107: [0.0, 0.0]
