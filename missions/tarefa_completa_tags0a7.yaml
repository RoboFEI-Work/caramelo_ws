# TAREFA COMPLETA (2026-08-25) — exercita TUDO com as tags 0..7:
#   - pick na SHELF (tags 1 e 2 partem da SH_1)
#   - place na SHELF (tag 0 termina na SH_1)
#   - mesas diferentes (WS_1, WS_2 e WS_4)
#   - EMPILHAR (tag 7 em cima da tag 3, na WS_4)
#   - CONTAINERS por cor (tag 5 -> pote VERMELHO, tag 6 -> pote AZUL, na WS_1)
#   - transferencias normais (tags 1, 2 e 4 -> WS_2)
#
# MONTAGEM FISICA antes de rodar:
#   SH_1 (prateleira): cubos 1 e 2
#   WS_1: cubos 0, 3 e 7 + os DOIS containers (vermelho e azul) com espaco livre
#   WS_2: cubos 5 e 6 (mesa que RECEBE 1, 2 e 4 — deixar espaco)
#   WS_4: cubo 4 (mesa que recebe a pilha 3+7)
#   Obs.: tag_0 foi acrescentada em tags_36h11.yaml em 25/08 — o nó apriltag
#   precisa ter reiniciado depois disso para enxerga-la.
#
# Rodar (com navegacao real):
#   ros2 run caramelo_navigation run_mission --map-name arenalegal_2026 \
#     --task /home/linux24-04/caramelo_ws/missions/tarefa_completa_tags0a7.yaml
#   (--dry-run so mostra o plano; --simulate-nav testa a manipulacao parado)
#
# Semantica (task_planner, 25/08): `containers: []` + objeto com `color:` que
# termina em mesa comum FORA de pilha => place no container daquela cor
# (deteccao por camera). Objetos sem `color:` = place normal. Pilha
# (`stacks: [[03, 07]]`, de BAIXO para CIMA) e shelf nunca vao para container.

task_id: TAREFA_COMPLETA_0A7
name: Tudo em uma - shelf, mesas, pilha e containers (tags 0..7)
duration_min: 20
active_service_areas: [WS_1, WS_2, WS_4, WS_5, SH_1]

objects:
  - {id: 05, type: ATTC}               # WS_1 -> SH_1 (place na prateleira)
  - {id: 01, type: ATTC}               # SH_1 -> WS_2 (pick na prateleira)
  - {id: 02, type: ATTC}               # SH_1 -> WS_2 (pick na prateleira)
  - {id: 03, type: ATTC}               # WS_1 -> WS_4 (BASE da pilha)
  - {id: 04, type: ATTC}               # WS_4 -> WS_2 (transferencia normal)
  - {id: 21, type: ATTC, color: RED}   # WS_2 -> container VERMELHO na WS_1
  - {id: 06, type: ATTC, color: BLUE}  # WS_2 -> container AZUL na WS_1
  - {id: 07, type: ATTC}               # WS_1 -> WS_4 (TOPO da pilha, sobre a 03)
containers: []                         # potes SEM tag, achados por COR na WS_1

start_state:
  SH_1:
    obj_ids: [01, 02]
    cont_ids: []
  WS_1:
    obj_ids: []
    cont_ids: []
  WS_2:
    obj_ids: [21, 06, 07]
    cont_ids: []
  WS_4:
    obj_ids: [04]
    cont_ids: []
  WS_5:
    obj_ids: [05, 03]
    cont_ids: []

finish_state:
  SH_1:
    obj_ids: [05]
    cont_ids: []
  WS_1:
    obj_ids: [21, 06]        # dentro dos containers vermelho/azul
    cont_ids: []
  WS_2:
    obj_ids: [01, 02, 04]
    cont_ids: []
  WS_4:
    obj_ids: [03, 07]
    cont_ids: []
    stacks: [[03, 07]]       # 07 em cima da 03
  WS_5:
    obj_ids: []
    cont_ids: []
