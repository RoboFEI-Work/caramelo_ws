# Tarefa completa: shelf, mesas, pilha e container (8 cubos, ids 08..24).
# Montagem fisica: SH_1: cubos 08 e 10; WS_1: vazia (recebe 12 e 18 - deixar
#   espaco); WS_2: cubos 12, 14 e 18 + container VERMELHO com espaco livre
#   (recebe 08, 10 e 20); WS_4: cubo 20 (recebe a pilha 24+14); WS_5: cubos 23 e 24.
# Uso: ros2 run caramelo_navigation run_mission --map-name <mapa> --task missions/tarefa_completa_tags0a7.yaml
#   (--dry-run so' mostra o plano; --simulate-nav testa a manipulacao parado)
#
# O que exercita:
#   - pick na SHELF (08 e 10 partem da SH_1) e place na SHELF (23 termina na SH_1:
#     tem color BLUE, mas prateleira nunca vai para container - nenhum pote azul);
#   - EMPILHAR na WS_4 (14 em cima da 24; `stacks:` e' de BAIXO para CIMA);
#   - CONTAINER por cor (20 RED -> pote vermelho na WS_2, achado pela camera);
#   - transferencias normais (12 e 18 -> WS_1; sem `color:` = place na mesa).
# Semantica (task_planner): `containers: []` + objeto com `color:` que termina em
# mesa comum FORA de pilha => place no container daquela cor. Objetos sem `color:`
# = place normal. Pilha e shelf nunca vao para container.
# Obs.: o nome do arquivo vem da versao original com as tags 0..7; os ids abaixo
# sao os atuais.

task_id: TAREFA_COMPLETA_0A7
name: Tudo em uma - shelf, mesas, pilha e containers (tags 0..7)
duration_min: 20
active_service_areas: [WS_1, WS_2, WS_4, WS_5, SH_1]

objects:
  - {id: 08, type: ATTC}               # SH_1 -> WS_2 (pick na prateleira)
  - {id: 10, type: ATTC}               # SH_1 -> WS_2 (pick na prateleira)
  - {id: 12, type: ATTC}               # WS_2 -> WS_1 (transferencia normal, sem cor)
  - {id: 14, type: ATTC}               # WS_2 -> WS_4 (TOPO da pilha, sobre a 24)
  - {id: 18, type: ATTC}               # WS_2 -> WS_1 (transferencia normal, sem cor)
  - {id: 20, type: ATTC, color: RED}   # WS_4 -> container VERMELHO na WS_2
  - {id: 23, type: ATTC, color: BLUE}  # WS_5 -> SH_1 (prateleira: nunca vai para container)
  - {id: 24, type: ATTC}               # WS_5 -> WS_4 (BASE da pilha)
containers: []                         # potes SEM tag, achados por COR (vermelho na WS_2)

start_state:
  SH_1:
    obj_ids: [08, 10]
    cont_ids: []
  WS_1:
    obj_ids: []
    cont_ids: []
  WS_2:
    obj_ids: [12, 14, 18]
    cont_ids: []
  WS_4:
    obj_ids: [20]
    cont_ids: []
  WS_5:
    obj_ids: [23, 24]
    cont_ids: []

finish_state:
  SH_1:
    obj_ids: [23]
    cont_ids: []
  WS_1:
    obj_ids: [12, 18]        # place normal na mesa (sem cor)
    cont_ids: []
  WS_2:
    obj_ids: [08, 10, 20]
    cont_ids: []
  WS_4:
    obj_ids: [24, 14]
    cont_ids: []
    stacks: [[24, 14]]       # 14 em cima da 24 (de baixo para cima)
  WS_5:
    obj_ids: []
    cont_ids: []
