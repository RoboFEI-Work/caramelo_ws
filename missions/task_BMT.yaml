# BMT1 - teste de Basic Manipulation Task: 3 cubos da WS_1 para a WS_4 (+1 decoy).
# Montagem fisica: WS_1: cubos 21, 07 e 01 + o decoy 03; WS_4: vazia (recebe os 3).
# Uso: ros2 run caramelo_navigation run_mission --map-name <mapa> --task missions/task_BMT.yaml

task_id: BMT1
name: Teste da BMT
duration_min: 6
active_service_areas: [WS_1, WS_4]

objects:
  - {id: 21, type: ATTC}    # tag_21: WS_1 -> WS_4
  - {id: 07, type: ATTC}    # tag_7: WS_1 -> WS_4
  - {id: 01, type: ATTC}    # tag_1: WS_1 -> WS_4
  - {id: 03, type: decoy}    # decoy: ignorado pelo planner (fica na WS_1)
containers: []

start_state:
  WS_1:
    obj_ids: [21, 07, 01, 03]
    cont_ids: []
  WS_4:
    obj_ids: []
    cont_ids: []

finish_state:
  WS_1:
    obj_ids: []
    cont_ids: []
  WS_4:
    obj_ids: [01, 21, 07]
    cont_ids: []
    
