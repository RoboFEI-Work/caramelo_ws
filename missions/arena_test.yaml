# Tarefa de teste da arena: 5 cubos, shelf + 4 mesas (EDITE conforme a montagem).
# Montagem fisica: SH_1: cubo 01; WS_1: cubos 02 e 03; WS_2: cubos 05 e 06;
#   WS_3, WS_4 e WS_5 vazias. Transferencias: 01 SH_1->WS_2 (pick na prateleira),
#   02 WS_1->WS_3, 03 WS_1->WS_5, 05 WS_2->SH_1 (place na prateleira), 06 WS_2->WS_1.
#   Os objetos tem color: RED, entao o planner gera place "em container por cor"
#   (01, 02, 03 e 06); sem pote vermelho na mesa o place cai na mesa normal
#   (container_fallback_to_table do place). Tire o color: para um place direto.
# Uso: ros2 run caramelo_navigation run_mission --map-name <mapa> --task missions/arena_test.yaml
#
# Formato = YAML da competicao (docs/guia_missoes.md, secao 3). Regras:
#   - so' estacoes com pose REAL em docking.yaml/service_areas.yaml do mapa; pose
#     placeholder [0,0,0] faz o executor abortar antes de mover (fail-fast);
#   - id do objeto = id da AprilTag colada nele (1..30 -> tag_1..tag_30);
#     containers sem tag, achados por COR;
#   - altura da mesa por estacao: ws_table_mapping.yaml do mapa (Mesa0/5/10/15).
# Fluxo gerado pelo planner: goto -> pick(s) -> home -> goto -> place(s) -> home;
# o executor anexa sozinho: home -> goto FINISH.

task_id: ARENA_TEST
name: Teste pick na shelf (tag_1 e tag_2 partem da SH_1)
duration_min: 10
active_service_areas: [WS_1, WS_2, WS_3, WS_4, WS_5, SH_1]

objects:
  - {id: 01, type: ATTC, color: RED}    # objeto com a tag id 1 (frame tag_1)
  - {id: 02, type: ATTC, color: RED}    # objeto com a tag id 2 (frame tag_2)
  - {id: 03, type: ATTC, color: RED}    # objeto com a tag id 3 (frame tag_3)
  - {id: 05, type: ATTC, color: RED}    # objeto com a tag id 5 (frame tag_5)
  - {id: 06, type: ATTC, color: RED}    # objeto com a tag id 6 (frame tag_6)
containers: []                          # sem potes na mesa neste teste

# SH_1 -> MesaSh no ws_table_mapping dispara pegar_obj_sh + fase1/fase2 com a IK
# custom (pick na prateleira); o place na prateleira (05 -> SH_1) usa o mesmo mapping.
start_state:
  SH_1:
    obj_ids: [01]
    cont_ids: []
  WS_1:
    obj_ids: [02,03]
    cont_ids: []
  WS_2:
    obj_ids: [05,06]
    cont_ids: []  
  WS_3:
    obj_ids: []
    cont_ids: [] 
  WS_4:
    obj_ids: []
    cont_ids: []
  WS_5:
    obj_ids: []
    cont_ids: []


finish_state:
  SH_1:
    obj_ids: [05]
    cont_ids: []
  WS_1:
    obj_ids: [06]
    cont_ids: []
  WS_2:
    obj_ids: [01]
    cont_ids: []  
  WS_3:
    obj_ids: [02]
    cont_ids: [] 
  WS_4:
    obj_ids: []
    cont_ids: [] 
  WS_5:
    obj_ids: [03]
    cont_ids: []
       