# Tarefa de teste da arena2_520 — EDITE conforme sua montagem física.
#
# Formato = YAML da competição (igual BMT.yaml do manip_bt/behavior_tree_manip/).
# Regras desta arena:
#   - Estações com pose REAL gravada: WS_1 (dock WS1) e WS_2 (dock WS2).
#     WS_3/WS_4/SH_1 etc. têm pose placeholder -> o executor aborta (fail-fast).
#   - id do objeto = id da AprilTag colada nele (cfg: 1..7 -> tag_1..tag_7,
#     20..28 -> tag_20..tag_28; potes: 10..16 -> ct_10..ct_16).
#   - Altura da mesa: WS_1 usa a pose de braco Mesa0 e WS_2 usa Mesa5
#     (ws_table_mapping.yaml do mapa). Hoje o place real validado foi na Mesa0.
#
# Fluxo gerado pelo planner: goto WS_1 -> pick(s) -> home -> goto WS_2 ->
# place(s) -> home; o executor ainda anexa sozinho: home -> goto FINISH.

task_id: ARENA_TEST
name: Teste pick na shelf (tag_1 e tag_2 partem da SH_1)
duration_min: 10
active_service_areas: [WS_1, WS_2, WS_3, WS_4, WS_5, WS_6, SH_1]

objects:
  - {id: 01, type: ATTC, color: RED}    # objeto com a tag id 1 (frame tag_1)
  - {id: 02, type: ATTC, color: RED}    # objeto com a tag id 2 (frame tag_2)
  - {id: 03, type: ATTC, color: RED}    # objeto com a tag id 3 (frame tag_3)
  - {id: 05, type: ATTC, color: RED}    # objeto com a tag id 5 (frame tag_5)
  - {id: 06, type: ATTC, color: RED}    # objeto com a tag id 6 (frame tag_6)
  - {id: 04, type: ATTC, color: RED}    # objeto com a tag id 4 (frame tag_4)
  - {id: 07, type: ATTC, color: RED}    # objeto com a tag id 7 (frame tag_7)
containers: []                          # sem potes na mesa neste teste

# 2026-08-15: teste do pick na PRATELEIRA — os DOIS objetos comecam na SH_1
# (ws_table_mapping: SH_1 -> MesaSh, que dispara pegar_obj_sh + fase1/fase2
# com a IK custom) e sao entregues na WS_1 (mesa comum, place ja validado).
