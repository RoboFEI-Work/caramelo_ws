    obj_ids: [6, 21]
    table: [21, 6]
  WS_3:
    obj_ids: [1, 13]
    table: [1, 13]
  WS_7:
    obj_ids: [19]
    table: [19]
    containers:
      RED: []
  SH_1:
    obj_ids: []
    levels:
      BOTTOM: []
      TOP: []
  WS_8:
    obj_ids: [2]
    table: [2]
    containers:
      BLUE: []
  WS_6:
    obj_ids: []
    stack: []
finish_state:
  WS_2:
    obj_ids: []
    table: []
  WS_3:
    obj_ids: []
    table: []
  WS_7:
    obj_ids: [21]
    table: []
    containers:
      RED: [21]
  SH_1:
    obj_ids: [1]
    levels:
