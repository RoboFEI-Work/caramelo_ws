- {id: 1}
- {id: 2}
- {id: 6}
- {id: 13}
- {id: 19}
- {id: 21}
containers:
- {color: BLUE, at: WS_8}
- {color: RED, at: WS_7}
stacking_areas:
  WS_6: {reference_tag: 200}
start_state:
