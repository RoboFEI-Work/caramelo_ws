- {id: 18, color: RED}
- {id: 20, color: BLUE}
- {id: 25, color: BLUE}
- {id: 27, color: BLUE}
containers:
- {color: BLUE, at: WS_7}
- {color: RED, at: WS_2}
precision_tables:
  PP_2:
    slot_tags: [111, 122, 133, 144, 155, 166, 177]
start_state:
  WS_7:
    obj_ids: [18]
    table: [18]
