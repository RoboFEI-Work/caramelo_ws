# BTT2 - teste de Basic Transportation Task: 5 cubos entre 4 mesas.
# Montagem fisica: WS_1: cubos 02 e 04; WS_2: cubo 01; WS_4: cubo 05; WS_5: cubo 03.
#   Destinos: 05 -> WS_1; 03 e 04 -> WS_2; 01 e 02 -> WS_4.
# Uso: ros2 run caramelo_navigation run_mission --map-name <mapa> --task missions/task_BTT_II.yaml

task_id: BTT2
name: Teste da BTT2
duration_min: 8
active_service_areas: [WS_1, WS_2, WS_4, WS_5]

objects:
  - {id: 05, type: ATTC}               
  - {id: 01, type: ATTC}              
  - {id: 02, type: ATTC}
  - {id: 03, type: ATTC}
  - {id: 04, type: ATTC}                 
              
containers: []                         
start_state:
  WS_1:
    obj_ids: [02,04]
    cont_ids: []
  WS_2:
    obj_ids: [01]
    cont_ids: []
  WS_4:
    obj_ids: [05]
    cont_ids: []
  WS_5:
    obj_ids: [03]
    cont_ids: []

finish_state:
  WS_1:
    obj_ids: [05]        
    cont_ids: []
  WS_2:
    obj_ids: [03,04]
    cont_ids: []
  WS_4:
    obj_ids: [01,02]
    cont_ids: []     
  WS_5:
    obj_ids: []
    cont_ids: []