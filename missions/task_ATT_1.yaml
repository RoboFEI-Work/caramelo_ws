# ATT1 - teste de Advanced Transportation Task: shelf, pilha e containers por cor.
# Montagem fisica: SH_1: cubos 01 e 02; WS_1: vazia + containers VERMELHO e AZUL
#   (recebe 21 e 06); WS_2: cubos 21 e 07; WS_4: cubos 03 e 15 (recebe a pilha
#   03+07); WS_5: cubos 05 e 04; WS_6: cubo 06. Os cubos 02, 15 e 04 so' aparecem
#   no start_state: o planner avisa e nao os pega.
# Uso: ros2 run caramelo_navigation run_mission --map-name <mapa> --task missions/task_ATT_1.yaml

task_id: ATT1
name: Teste da ATT1
duration_min: 14
active_service_areas: [WS_1, WS_2, WS_4, WS_5, WS_6, SH_1]

objects:
  - {id: 05, type: ATTC}               # WS_5 -> SH_1 (place na prateleira)
  - {id: 01, type: ATTC}               # SH_1 -> WS_2 (pick na prateleira)
  - {id: 02, type: ATTC}               # so' no start_state (SH_1): aviso, nao e' pego
  - {id: 03, type: ATTC}               # fica na WS_4 (BASE da pilha)
  - {id: 15, type: ATTC}               # so' no start_state (WS_4): aviso, nao e' pego
  - {id: 04, type: ATTC}               # so' no start_state (WS_5): aviso, nao e' pego
  - {id: 21, type: ATTC, color: RED}   # WS_2 -> container VERMELHO na WS_1
  - {id: 06, type: ATTC, color: BLUE}  # WS_6 -> container AZUL na WS_1
  - {id: 07, type: ATTC}               # WS_2 -> WS_4 (TOPO da pilha, sobre a 03)
containers: []                         # potes SEM tag, achados por COR na WS_1

start_state:
  SH_1:
    obj_ids: [01, 02]
    cont_ids: []
  WS_1:
    obj_ids: []
    cont_ids: []
  WS_2:
    obj_ids: [21, 07]
    cont_ids: []
  WS_4:
    obj_ids: [03,15]
    cont_ids: []
  WS_5:
    obj_ids: [05, 04]
    cont_ids: []
  WS_6:
    obj_ids: [06]
    cont_ids: []

finish_state:
  SH_1:
    obj_ids: [05]
    cont_ids: []
  WS_1:
    obj_ids: [21, 06]        # dentro dos containers vermelho/azul
    cont_ids: []
  WS_2:
    obj_ids: [01]
    cont_ids: []
  WS_4:
    obj_ids: [03, 07]
    cont_ids: []
    stacks: [[03, 07]]       # 07 em cima da 03
  WS_5:
    obj_ids: []
    cont_ids: []
  WS_6:
    obj_ids: []
    cont_ids: []
